<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Caveat:wght@400..700&family=Dancing+Script:wght@400..700&family=Finlandica+Text:ital,wght@0,100..900;1,100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Outfit:wght@100..900&family=Quicksand:wght@300..700&family=Sansita+Swashed:wght@300..900&family=VT323&family=Wallpoet&display=swap" rel="stylesheet">
</head>
<body>
    <div style="height: 100vh; background-color: black"; class="d-flex align-items-center justify-content-center";>
        <h1 id="clock" class="text-light" style="font-size: 150px; font-family: 'wallpoet';">HH:MM:SS AM</h1>
    </div>
</body>
<script>
    const getTime=()=>{
        let localTime = new Date()
    console.log(localTime)
    let session='AM'
    let hours=localTime.getHours()
    let minutes=localTime.getMinutes()
    let seconds=localTime.getSeconds()
    console.log(hours, minutes, seconds)
    let display=document.getElementById("clock")

    if(hours>12){
        hours=hours-12
        session='PM'
    }
    if(hours<10){
        hours='0'+hours
    }
    if(minutes<10){
        minutes='0'+minutes
    }
    if(seconds<10){
        seconds='0'+seconds
    }
        display.innerHTML=`${hours}:${minutes}:${seconds} ${session}`

    setTimeout(()=>{
        getTime()})
    }
    getTime()
</script>
</html>
