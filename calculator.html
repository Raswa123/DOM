<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator UI</title>

<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #1e1e1e;
}

.calculator{
    width: 320px;
    background-color: #2c2c2c;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.4);
}

.display{
    width: 100%;
    height: 60px;
    margin-bottom: 20px;
    border: none;
    border-radius: 10px;
    background-color: white;
    font-size: 28px;
    text-align: right;
    padding: 10px;
    outline: none;
}

.buttons{
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 10px;
}

button{
    height: 60px;
    border: none;
    border-radius: 10px;
    font-size: 22px;
    cursor: pointer;
    background-color: #444;
    color: white;
}

button:hover{
    background-color: #666;
}

.operator{
    background-color: orange;
}

.operator:hover{
    background-color: darkorange;
}

.equal{
    background-color: green;
}

.equal:hover{
    background-color: darkgreen;
}

.clear{
    background-color: crimson;
}

.clear:hover{
    background-color: darkred;
}
</style>
</head>

<body>

<div class="calculator">

    <input type="text" class="display" placeholder="0" readonly id="output">

    <div class="buttons">
        <button class="clear" onclick="clearAll()">C</button>
        <button class="operator" onclick="displayData('/')">/</button>
        <button class="operator" onclick="displayData('*')">*</button>
        <button class="operator" onclick="removeLastItem()">⌫</button>

        <button id="btn7" onclick="displayData('7')">7</button>
        <button id="btn8" onclick="displayData('8')">8</button>
        <button id="btn9" onclick="displayData('9')">9</button>
        <button class="operator" onclick="displayData('-')">-</button>

        <button id="btn4" onclick="displayData('4')">4</button>
        <button id="btn5" onclick="displayData('5')">5</button>
        <button id="btn6" onclick="displayData('6')">6</button>
        <button class="operator" onclick="displayData('+')">+</button>

        <button id="btn1" onclick="displayData('1')">1</button>
        <button id="btn2" onclick="displayData('2')">2</button>
        <button id="btn3" onclick="displayData('3')">3</button>
        <button class="equal" onclick="displayResult()">=</button>

        <button id="btn0" onclick="displayData('0')">0</button>
        <button id="btnDot" onclick="displayData('.')">.</button>
        <button id="btnOpen" onclick="displayData('(')">(</button>
        <button id="btnClose" onclick="displayData(')')">)</button>
    </div>

</div>

</body>
<script src="cal.js"></script>
</html>
